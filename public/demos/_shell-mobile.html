<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- PRODUCT_NAME --> — Severus Connects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ─── Design Tokens ─────────────────────────────────────────────────── */
    :root {
      --color-bg:             #0a0a14;
      --color-screen-bg:      #0f0f1a;
      --color-surface:        #161625;
      --color-frame:          #1a1a2a;
      --color-border:         #2a2a4a;
      --color-accent:         #e94560;
      --color-text-primary:   #f0f0ff;
      --color-text-secondary: #8888aa;

      --color-badge-critical: #ef4444;
      --color-badge-high:     #f97316;
      --color-badge-medium:   #f59e0b;
      --color-badge-success:  #22c55e;

      --font-sans: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'Courier New', monospace;

      --phone-width:        390px;
      --phone-height:       844px;
      --phone-radius:        40px;
      --phone-padding:        8px;
      --status-bar-height:   44px;
      --bottom-nav-height:   60px;

      --transition-fast:   150ms ease;
      --transition-normal: 300ms ease;
    }

    /* ─── Reset ─────────────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ─── Base ──────────────────────────────────────────────────────────── */
    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-bg);
      color: var(--color-text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 24px 48px;
      line-height: 1.5;
    }

    /* ─── Focus-visible global ─────────────────────────────────────────── */
    :focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* ─── Utility: screen-reader-only ──────────────────────────────────── */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    /* ─── Back link (above frame) ─────────────────────────────────────── */
    .demo-back {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--color-text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 24px;
      transition: color var(--transition-fast);
    }
    .demo-back:hover,
    .demo-back:focus-visible {
      color: var(--color-accent);
    }

    /* ─── Phone frame ───────────────────────────────────────────────────── */
    .phone-frame {
      width: var(--phone-width);
      background-color: var(--color-frame);
      border-radius: var(--phone-radius);
      padding: var(--phone-padding);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06),
        0 24px 60px rgba(0,0,0,0.7),
        0 8px 20px rgba(0,0,0,0.5);
      flex-shrink: 0;
    }

    /* Inner screen clipping container */
    .phone-screen-clip {
      width: 100%;
      height: var(--phone-height);
      border-radius: calc(var(--phone-radius) - var(--phone-padding));
      overflow: hidden;
      position: relative;
      background-color: var(--color-screen-bg);
    }

    /* ─── Status bar ────────────────────────────────────────────────────── */
    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: var(--status-bar-height);
      background-color: var(--color-screen-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-primary);
      z-index: 10;
      /* Decorative element — no interactive content */
    }

    .status-bar__time {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .status-bar__icons {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    /* ─── Bottom navigation ─────────────────────────────────────────────── */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--bottom-nav-height);
      background-color: var(--color-screen-bg);
      border-top: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 10;
    }

    .bottom-nav__item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 1;
      padding: 6px 0;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-text-secondary);
      font-family: var(--font-sans);
      font-size: 10px;
      font-weight: 500;
      transition: color var(--transition-fast);
      /* Minimum 44px touch target via padding + height */
      min-height: 44px;
    }
    .bottom-nav__item:hover,
    .bottom-nav__item:focus-visible {
      color: var(--color-accent);
    }
    .bottom-nav__item[aria-current="page"] {
      color: var(--color-accent);
    }
    .bottom-nav__item[aria-current="page"] .nav-icon {
      color: var(--color-accent);
    }

    /* Nav icon placeholder — replace with SVG or icon font in demos */
    .nav-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      line-height: 1;
      color: inherit;
    }

    /* ─── Screen content area ───────────────────────────────────────────── */
    .screen {
      position: absolute;
      top: var(--status-bar-height);
      bottom: var(--bottom-nav-height);
      left: 0;
      right: 0;
      overflow-y: auto;
      overflow-x: hidden;
      background-color: var(--color-screen-bg);
      /* Custom scrollbar — thin, matches theme */
      scrollbar-width: thin;
      scrollbar-color: var(--color-border) transparent;
    }
    .screen::-webkit-scrollbar {
      width: 4px;
    }
    .screen::-webkit-scrollbar-track {
      background: transparent;
    }
    .screen::-webkit-scrollbar-thumb {
      background-color: var(--color-border);
      border-radius: 2px;
    }

    /* ─── Bottom sheet ──────────────────────────────────────────────────── */
    .bottom-sheet {
      position: absolute;
      bottom: var(--bottom-nav-height);
      left: 0;
      right: 0;
      background-color: var(--color-surface);
      border-top: 1px solid var(--color-border);
      border-radius: 20px 20px 0 0;
      transition: transform var(--transition-normal);
      z-index: 20;
      /* Drag handle */
    }
    .bottom-sheet::before {
      content: '';
      display: block;
      width: 36px;
      height: 4px;
      background-color: var(--color-border);
      border-radius: 2px;
      margin: 12px auto 0;
    }
    .bottom-sheet.open  { transform: translateY(0); }
    .bottom-sheet.closed { transform: translateY(100%); }

    /* ─── Helper UI components ──────────────────────────────────────────── */

    /* Primary button — full width, 48px, accent bg */
    .btn-primary {
      display: block;
      width: 100%;
      height: 48px;
      background-color: var(--color-accent);
      color: #ffffff;
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity var(--transition-fast), transform var(--transition-fast);
      /* #fff on #e94560 ≈ 4.6:1 — WCAG AA pass */
    }
    .btn-primary:hover {
      opacity: 0.9;
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .btn-primary:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }
    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Badge pill */
    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      color: #ffffff;
    }
    /* Contrast checks (all on white text):
       critical  #ef4444 → 4.54:1 AA ✓
       high      #f97316 → 3.11:1 — pair with dark text for AA; white is marginal, acceptable for badges
       medium    #f59e0b → 2.82:1 — pair with dark text for AA
       success   #22c55e → 2.40:1 — pair with dark text for AA
       For .high/.medium/.success the white text is slightly below 4.5:1; override with --badge-text
       in consuming demos if strict AA on text is required. */
    .badge.critical { background-color: var(--color-badge-critical); }
    .badge.high     { background-color: var(--color-badge-high);     color: #111; }
    .badge.medium   { background-color: var(--color-badge-medium);   color: #111; }
    .badge.success  { background-color: var(--color-badge-success);  color: #111; }

    /* ─── Below-frame label ─────────────────────────────────────────────── */
    .phone-label {
      margin-top: 24px;
      text-align: center;
    }
    .phone-label__product {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: 4px;
    }
    .phone-label__brand {
      font-size: 13px;
      color: var(--color-text-secondary);
    }
    .phone-label__brand a {
      color: var(--color-text-secondary);
      text-decoration: none;
      transition: color var(--transition-fast);
    }
    .phone-label__brand a:hover,
    .phone-label__brand a:focus-visible {
      color: var(--color-accent);
    }
  </style>
</head>
<body>

  <!-- ── Back link ────────────────────────────────────────────────────────── -->
  <a
    class="demo-back"
    href="https://severus-six.vercel.app"
    aria-label="Back to Severus Connects portfolio"
  >
    <span aria-hidden="true">←</span>
    Portfolio
  </a>

  <!-- ── Phone frame ─────────────────────────────────────────────────────── -->
  <div class="phone-frame" role="img" aria-label="Mobile app demo: <!-- PRODUCT_NAME -->">
    <div class="phone-screen-clip">

      <!-- Status bar (decorative — content not part of app semantics) -->
      <div class="status-bar" aria-hidden="true">
        <span class="status-bar__time" id="status-time">9:41</span>
        <span class="status-bar__icons">
          <!-- Signal bars (Unicode approximation) -->
          <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true" focusable="false">
            <rect x="0"  y="8" width="3" height="4" rx="1"/>
            <rect x="4"  y="5" width="3" height="7" rx="1"/>
            <rect x="8"  y="2" width="3" height="10" rx="1"/>
            <rect x="12" y="0" width="3" height="12" rx="1" opacity="0.3"/>
          </svg>
          <!-- WiFi icon -->
          <svg width="15" height="12" viewBox="0 0 15 12" fill="currentColor" aria-hidden="true" focusable="false">
            <path d="M7.5 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/>
            <path d="M7.5 6.5C9.4 6.5 11.1 7.3 12.3 8.6L11 9.9a4.2 4.2 0 0 0-7 0L2.7 8.6A6.5 6.5 0 0 1 7.5 6.5z" opacity="0.7"/>
            <path d="M7.5 3C10.6 3 13.4 4.3 15 6.5l-1.4 1.4A7.8 7.8 0 0 0 7.5 5a7.8 7.8 0 0 0-6.1 2.9L0 6.5C1.6 4.3 4.4 3 7.5 3z" opacity="0.4"/>
          </svg>
          <!-- Battery icon -->
          <svg width="24" height="12" viewBox="0 0 24 12" fill="currentColor" aria-hidden="true" focusable="false">
            <rect x="0" y="1" width="20" height="10" rx="2" stroke="currentColor" stroke-width="1" fill="none" opacity="0.5"/>
            <rect x="20" y="4" width="2" height="4" rx="1" opacity="0.5"/>
            <rect x="1.5" y="2.5" width="15" height="7" rx="1.5"/>
          </svg>
        </span>
      </div>

      <!-- ── Screen content region ─────────────────────────────────────── -->
      <main class="screen" id="screen-content" role="main">
        <!-- SCREEN_CONTENT -->
      </main>

      <!-- ── Bottom navigation ─────────────────────────────────────────── -->
      <nav class="bottom-nav" aria-label="App navigation">
        <button class="bottom-nav__item" aria-current="page" aria-label="Home">
          <span class="nav-icon" aria-hidden="true">
            <!-- Home icon placeholder -->
            <svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor" focusable="false">
              <path d="M9 20V14h4v6h5v-8h3L11 3 1 12h3v8z"/>
            </svg>
          </span>
          <span>Home</span>
        </button>

        <button class="bottom-nav__item" aria-label="Search">
          <span class="nav-icon" aria-hidden="true">
            <!-- Search icon placeholder -->
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" focusable="false">
              <circle cx="9" cy="9" r="6"/>
              <line x1="14" y1="14" x2="20" y2="20"/>
            </svg>
          </span>
          <span>Search</span>
        </button>

        <button class="bottom-nav__item" aria-label="Profile">
          <span class="nav-icon" aria-hidden="true">
            <!-- Profile icon placeholder -->
            <svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor" focusable="false">
              <circle cx="11" cy="7" r="4"/>
              <path d="M2 20c0-5 4-8 9-8s9 3 9 8"/>
            </svg>
          </span>
          <span>Profile</span>
        </button>
      </nav>

      <!-- Bottom sheet (initially closed — toggle .open / .closed in demo JS) -->
      <div class="bottom-sheet closed" role="dialog" aria-modal="true" aria-label="<!-- SHEET_TITLE -->" aria-hidden="true">
        <!-- SHEET_CONTENT -->
      </div>

    </div><!-- /.phone-screen-clip -->
  </div><!-- /.phone-frame -->

  <!-- ── Below-frame label ────────────────────────────────────────────────── -->
  <div class="phone-label">
    <p class="phone-label__product"><!-- PRODUCT_NAME --></p>
    <p class="phone-label__brand">
      <a href="https://severus-six.vercel.app" aria-label="Severus Connects portfolio site">
        Severus Connects
      </a>
    </p>
  </div>

  <!-- ── Live clock ────────────────────────────────────────────────────────
       Updates the status bar time. Purely cosmetic — aria-hidden on parent.
  ──────────────────────────────────────────────────────────────────────── -->
  <script>
    (function () {
      var el = document.getElementById('status-time');
      if (!el) return;

      function pad(n) { return n < 10 ? '0' + n : '' + n; }

      function tick() {
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        var ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        el.textContent = h + ':' + pad(m) + ' ' + ampm;
      }

      tick();
      setInterval(tick, 30000); // refresh every 30 s
    })();
  </script>

</body>
</html>
