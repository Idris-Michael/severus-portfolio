<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- PRODUCT_NAME --> — Severus Connects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ─── Design Tokens ─────────────────────────────────────────────────── */
    :root {
      --color-bg:          #0f0f1a;
      --color-surface:     #161625;
      --color-border:      #2a2a4a;
      --color-accent:      #e94560;
      --color-text-primary:   #f0f0ff;
      --color-text-secondary: #8888aa;

      --font-sans: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'Courier New', monospace;

      --radius-sm:  4px;
      --radius-md:  8px;
      --radius-lg: 12px;

      --transition-fast: 150ms ease;
    }

    /* ─── Reset ─────────────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ─── Base ──────────────────────────────────────────────────────────── */
    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-bg);
      color: var(--color-text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    /* ─── Focus-visible global ─────────────────────────────────────────── */
    :focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }

    /* ─── Header ────────────────────────────────────────────────────────── */
    .demo-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    /* Back link */
    .demo-header__back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--color-text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      transition: color var(--transition-fast);
      flex-shrink: 0;
    }
    .demo-header__back:hover,
    .demo-header__back:focus-visible {
      color: var(--color-accent);
    }
    .demo-header__back-arrow {
      font-size: 16px;
      line-height: 1;
      /* Decorative — screen readers read the aria-label instead */
      aria-hidden: true;
    }

    /* Title group */
    .demo-header__title-group {
      flex: 1;
      min-width: 0;
    }
    .demo-header__title {
      font-size: 20px;
      font-weight: 600;
      color: var(--color-text-primary);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .demo-header__subtitle {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Status badge */
    .demo-header__badge {
      display: inline-block;
      background-color: var(--color-accent);
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      white-space: nowrap;
      flex-shrink: 0;
      /* Provides sufficient contrast: #fff on #e94560 ≈ 4.6:1 (AA pass) */
    }

    /* ─── Main ──────────────────────────────────────────────────────────── */
    .demo-main {
      flex: 1;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* ─── Footer ────────────────────────────────────────────────────────── */
    .demo-footer {
      border-top: 1px solid var(--color-border);
      padding: 16px 24px;
      color: var(--color-text-secondary);
      font-size: 12px;
      text-align: center;
    }
    .demo-footer a {
      color: var(--color-text-secondary);
      text-decoration: none;
      transition: color var(--transition-fast);
    }
    .demo-footer a:hover,
    .demo-footer a:focus-visible {
      color: var(--color-accent);
    }

    /* ─── Utility: screen-reader-only ──────────────────────────────────── */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────────────────────── -->
  <header class="demo-header" role="banner">
    <a
      class="demo-header__back"
      href="https://severus-six.vercel.app"
      aria-label="Back to Severus Connects portfolio"
    >
      <span class="demo-header__back-arrow" aria-hidden="true">←</span>
      Portfolio
    </a>

    <div class="demo-header__title-group">
      <h1 class="demo-header__title"><!-- PRODUCT_NAME --></h1>
      <p class="demo-header__subtitle"><!-- PRODUCT_TAGLINE --></p>
    </div>

    <span class="demo-header__badge" role="status" aria-label="Status: Live Demo">
      Live Demo
    </span>
  </header>

  <!-- ── Main content ────────────────────────────────────────────────────── -->
  <main class="demo-main" id="main-content">
    <!-- CONTENT_AREA -->
  </main>

  <!-- ── Footer ──────────────────────────────────────────────────────────── -->
  <footer class="demo-footer" role="contentinfo">
    Severus Connects &middot;
    <a href="https://severus-six.vercel.app" aria-label="Severus Connects portfolio site">
      severus-six.vercel.app
    </a>
  </footer>

</body>
</html>
