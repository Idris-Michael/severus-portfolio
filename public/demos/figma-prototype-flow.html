<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Figma Prototype Flow A/B</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="_phone-shell.css" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f23;--bg2:#13132b;--panel:#18183a;--border:rgba(255,255,255,.07);
  --fg:#e2e8f0;--muted:#64748b;--purple:#818cf8;--violet:#a78bfa;
  --green:#34d399;--amber:#f59e0b;--orange:#F97316;
  --ease:cubic-bezier(.16,1,.3,1);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif;font-size:14px}

/* TOP BAR */
.topbar{height:52px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:16px;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:12px}
.figma-logo{width:20px;height:20px;flex-shrink:0}
.flow-selector{display:flex;background:var(--panel);border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.flow-btn{padding:6px 16px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;color:var(--muted);border:none;background:transparent}
.flow-btn.active{background:var(--purple);color:#fff}
.step-indicator{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
.record-toggle{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);cursor:pointer}
.rec-dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.record-toggle.active .rec-dot{background:#f87171;animation:blink .8s ease-in-out infinite}
.record-toggle.active{color:var(--fg)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* MAIN LAYOUT */
.layout{display:flex;flex-direction:column;height:calc(100vh - 52px);overflow:hidden}
.phone-area{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;gap:32px;overflow:hidden}
.phone-env{--frame-w:240px;--frame-h:490px}

/* Screen slides container */
.slides-outer{width:100%;height:100%;overflow:hidden;position:relative}
.slides-track{display:flex;height:100%;transition:transform .28s cubic-bezier(.16,1,.3,1)}
.slide{min-width:100%;height:100%;flex-shrink:0}

/* Hotspots */
.hotspot{position:absolute;cursor:pointer;z-index:10}
.hotspot-ring{width:32px;height:32px;border-radius:50%;border:2px solid var(--orange);background:rgba(249,115,22,.15);display:flex;align-items:center;justify-content:center;animation:pulse-ring 1.5s ease-in-out infinite}
@keyframes pulse-ring{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.15);opacity:1}}
.hotspot-ring::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--orange)}

/* CSS Wireframe screens */
.wf{width:100%;height:100%;background:#1a1a3a;padding:12px;display:flex;flex-direction:column;gap:8px;font-family:'Inter',sans-serif;position:relative}
.wf-bar{height:10px;background:rgba(255,255,255,.12);border-radius:4px}
.wf-title{height:16px;width:70%;background:rgba(255,255,255,.2);border-radius:4px}
.wf-sub{height:10px;width:50%;background:rgba(255,255,255,.1);border-radius:4px}
.wf-img{flex:1;background:rgba(129,140,248,.12);border-radius:8px;border:1px solid rgba(129,140,248,.2)}
.wf-cta{height:36px;border-radius:18px;background:rgba(129,140,248,.3);border:1px solid rgba(129,140,248,.5);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--purple);font-weight:600}
.wf-list{display:flex;flex-direction:column;gap:6px;flex:1}
.wf-row{height:32px;background:rgba(255,255,255,.06);border-radius:6px;display:flex;align-items:center;padding:0 10px;gap:8px}
.wf-ava{width:20px;height:20px;border-radius:50%;background:rgba(129,140,248,.25)}
.wf-line{height:8px;flex:1;background:rgba(255,255,255,.12);border-radius:4px}
.wf-form{display:flex;flex-direction:column;gap:8px;flex:1}
.wf-input{height:32px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.wf-check{height:20px;display:flex;align-items:center;gap:6px}
.wf-cb{width:14px;height:14px;border-radius:3px;border:1px solid rgba(129,140,248,.5)}
.wf-cb-lbl{height:8px;width:80px;background:rgba(255,255,255,.12);border-radius:4px}
.wf-success{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.wf-tick{width:40px;height:40px;border-radius:50%;background:rgba(52,211,153,.15);border:2px solid var(--green);display:flex;align-items:center;justify-content:center;font-size:18px}
.wf-s-title{height:14px;width:100px;background:rgba(52,211,153,.3);border-radius:4px}
.wf-s-sub{height:10px;width:140px;background:rgba(255,255,255,.1);border-radius:4px}

/* Flow B — lighter style */
.wf.vb{background:#f0f4ff}
.wf.vb .wf-bar{background:rgba(124,58,237,.15)}
.wf.vb .wf-title{background:rgba(124,58,237,.3)}
.wf.vb .wf-sub{background:rgba(124,58,237,.15)}
.wf.vb .wf-img{background:rgba(124,58,237,.08);border-color:rgba(124,58,237,.2)}
.wf.vb .wf-cta{background:rgba(124,58,237,.15);border-color:rgba(124,58,237,.4);color:#7c3aed}
.wf.vb .wf-row{background:rgba(124,58,237,.06)}
.wf.vb .wf-ava{background:rgba(124,58,237,.2)}
.wf.vb .wf-line{background:rgba(0,0,0,.12)}
.wf.vb .wf-input{background:#fff;border-color:rgba(124,58,237,.2)}

/* BOTTOM STATS BAR */
.stats-bar{background:var(--bg2);border-top:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:24px;flex-shrink:0}
.stat-group{display:flex;flex-direction:column;gap:4px}
.stat-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.completion-bars{display:flex;flex-direction:column;gap:6px;flex:1;max-width:320px}
.cbar-row{display:flex;align-items:center;gap:8px}
.cbar-lbl{font-size:11px;color:var(--muted);width:60px;flex-shrink:0}
.cbar-track{flex:1;height:6px;background:var(--panel);border-radius:3px;overflow:hidden}
.cbar-fill{height:100%;border-radius:3px;transition:width .6s var(--ease)}
.cbar-pct{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--fg);width:32px;text-align:right}
.export-btn{margin-left:auto;padding:8px 16px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px;cursor:pointer;transition:all .2s}
.export-btn:hover{border-color:var(--purple);color:var(--purple)}
.stat-num{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-left">
    <svg class="figma-logo" viewBox="0 0 38 57" fill="none">
      <path d="M19 28.5a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0z" fill="#1ABCFE"/>
      <path d="M0 47.5A9.5 9.5 0 0 1 9.5 38H19v9.5a9.5 9.5 0 0 1-19 0z" fill="#0ACF83"/>
      <path d="M19 0v19h9.5a9.5 9.5 0 0 0 0-19H19z" fill="#FF7262"/>
      <path d="M0 9.5A9.5 9.5 0 0 1 9.5 0H19v19H9.5A9.5 9.5 0 0 1 0 9.5z" fill="#F24E1E"/>
      <path d="M0 28.5A9.5 9.5 0 0 1 9.5 19H19v19H9.5A9.5 9.5 0 0 1 0 28.5z" fill="#A259FF"/>
    </svg>
    <div class="flow-selector" role="tablist" aria-label="Select flow">
      <button class="flow-btn active" id="btn-a" onclick="setFlow('a')" role="tab" aria-selected="true">Flow A</button>
      <button class="flow-btn" id="btn-b" onclick="setFlow('b')" role="tab" aria-selected="false">Flow B</button>
    </div>
    <span class="step-indicator" id="step-ind">Step 1 / 5</span>
  </div>
  <div class="record-toggle active" id="rec-btn" onclick="toggleRecord()" role="button" aria-pressed="true">
    <div class="rec-dot"></div>
    <span id="rec-label">Recording</span>
  </div>
</div>

<div class="layout">
  <div class="phone-area">
    <!-- Phone A -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
      <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Flow A — Control</span>
      <div class="phone-env" id="phone-a">
        <div class="phone-chassis">
          <div class="phone-notch"><div class="phone-notch-pill"></div></div>
          <div class="phone-statusbar">
            <span>9:41</span>
            <div class="phone-status-icons">
              <svg width="14" height="10" viewBox="0 0 14 10" fill="white"><rect x="0" y="5" width="2" height="5" rx="1"/><rect x="3" y="3" width="2" height="7" rx="1"/><rect x="6" y="1" width="2" height="9" rx="1"/><rect x="9" y="0" width="2" height="10" rx="1"/></svg>
              <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="white" stroke-opacity="0.35"/><rect x="2" y="2" width="16" height="8" rx="2" fill="white"/></svg>
            </div>
          </div>
          <div class="phone-screen" id="screen-a" onclick="advanceStep('a')">
            <div class="slides-outer">
              <div class="slides-track" id="track-a"></div>
            </div>
            <!-- Hotspot -->
            <div class="hotspot" id="hs-a" style="bottom:60px;left:50%;transform:translateX(-50%)" aria-label="Tap to advance">
              <div class="hotspot-ring"></div>
            </div>
          </div>
          <div class="phone-home"></div>
        </div>
      </div>
    </div>

    <!-- Phone B -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
      <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Flow B — Variant</span>
      <div class="phone-env" id="phone-b">
        <div class="phone-chassis">
          <div class="phone-notch"><div class="phone-notch-pill"></div></div>
          <div class="phone-statusbar">
            <span>9:41</span>
            <div class="phone-status-icons">
              <svg width="14" height="10" viewBox="0 0 14 10" fill="white"><rect x="0" y="5" width="2" height="5" rx="1"/><rect x="3" y="3" width="2" height="7" rx="1"/><rect x="6" y="1" width="2" height="9" rx="1"/><rect x="9" y="0" width="2" height="10" rx="1"/></svg>
              <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="white" stroke-opacity="0.35"/><rect x="2" y="2" width="16" height="8" rx="2" fill="white"/></svg>
            </div>
          </div>
          <div class="phone-screen" id="screen-b" onclick="advanceStep('b')">
            <div class="slides-outer">
              <div class="slides-track" id="track-b"></div>
            </div>
            <div class="hotspot" id="hs-b" style="bottom:60px;left:50%;transform:translateX(-50%)" aria-label="Tap to advance">
              <div class="hotspot-ring"></div>
            </div>
          </div>
          <div class="phone-home"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- BOTTOM STATS -->
  <div class="stats-bar">
    <div class="stat-group">
      <span class="stat-lbl">Completion</span>
      <span class="stat-num" id="comp-a-num" style="color:var(--orange)">0%</span>
    </div>
    <div class="completion-bars">
      <div class="cbar-row">
        <span class="cbar-lbl">Flow A</span>
        <div class="cbar-track"><div class="cbar-fill" id="bar-a" style="background:var(--orange);width:0%"></div></div>
        <span class="cbar-pct" id="pct-a">0%</span>
      </div>
      <div class="cbar-row">
        <span class="cbar-lbl">Flow B</span>
        <div class="cbar-track"><div class="cbar-fill" id="bar-b" style="background:var(--purple);width:0%"></div></div>
        <span class="cbar-pct" id="pct-b">0%</span>
      </div>
    </div>
    <div class="stat-group">
      <span class="stat-lbl">Completion</span>
      <span class="stat-num" id="comp-b-num" style="color:var(--purple)">0%</span>
    </div>
    <button class="export-btn" onclick="exportResults()" aria-label="Export test results as JSON">Export results →</button>
  </div>
</div>

<script src="_phone-shell.js"></script>
<script>
const STEPS = 5;
const state = { a: 0, b: 0 };

// Build wireframe slides for each flow
function buildSlides(trackId, flow) {
  const track = document.getElementById(trackId);
  const screens = [
    // Screen 1: Onboarding splash
    `<div class="slide"><div class="wf ${flow==='b'?'vb':''}">
      <div class="wf-bar" style="width:60%;margin:4px auto"></div>
      <div class="wf-img" style="flex:2"></div>
      <div style="display:flex;flex-direction:column;gap:6px;padding:4px 0">
        <div class="wf-title" style="margin:0 auto"></div>
        <div class="wf-sub" style="margin:0 auto"></div>
      </div>
      <div class="wf-cta">Get Started</div>
      <div class="wf-bar" style="width:40%;margin:0 auto;background:rgba(255,255,255,.06)"></div>
    </div></div>`,
    // Screen 2: Feature list
    `<div class="slide"><div class="wf ${flow==='b'?'vb':''}">
      <div class="wf-title"></div>
      <div class="wf-sub"></div>
      <div class="wf-list">
        ${[1,2,3,4].map(()=>`<div class="wf-row"><div class="wf-ava"></div><div class="wf-line"></div></div>`).join('')}
      </div>
      <div class="wf-cta">Continue →</div>
    </div></div>`,
    // Screen 3: Form
    `<div class="slide"><div class="wf ${flow==='b'?'vb':''}">
      <div class="wf-title"></div>
      <div class="wf-form">
        <div class="wf-input"></div>
        <div class="wf-input"></div>
        <div class="wf-input"></div>
        <div class="wf-check"><div class="wf-cb"></div><div class="wf-cb-lbl"></div></div>
      </div>
      <div class="wf-cta">Submit</div>
    </div></div>`,
    // Screen 4: Loading/processing
    `<div class="slide"><div class="wf ${flow==='b'?'vb':''}">
      <div style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px">
        <div style="width:32px;height:32px;border-radius:50%;border:3px solid rgba(129,140,248,.3);border-top-color:var(--purple);animation:spin .8s linear infinite"></div>
        <div class="wf-sub" style="width:80px;margin:0 auto"></div>
      </div>
    </div></div>`,
    // Screen 5: Success
    `<div class="slide"><div class="wf ${flow==='b'?'vb':''}">
      <div class="wf-success">
        <div class="wf-tick">✓</div>
        <div class="wf-s-title"></div>
        <div class="wf-s-sub"></div>
        <div class="wf-s-sub" style="width:100px;margin-top:4px"></div>
      </div>
    </div></div>`,
  ];
  track.innerHTML = screens.join('');
}

buildSlides('track-a', 'a');
buildSlides('track-b', 'b');

function advanceStep(flow) {
  if (state[flow] >= STEPS - 1) return;
  state[flow]++;
  const track = document.getElementById('track-' + flow);
  track.style.transform = `translateX(-${state[flow] * 100}%)`;
  // Hide hotspot on last step
  if (state[flow] >= STEPS - 1) {
    document.getElementById('hs-' + flow).style.opacity = '0';
  }
  updateBars();
  document.getElementById('step-ind').textContent = `Step ${Math.max(state.a, state.b) + 1} / ${STEPS}`;
}

function updateBars() {
  const pctA = Math.round((state.a / (STEPS-1)) * 100);
  const pctB = Math.round((state.b / (STEPS-1)) * 100);
  document.getElementById('bar-a').style.width = pctA + '%';
  document.getElementById('bar-b').style.width = pctB + '%';
  document.getElementById('pct-a').textContent = pctA + '%';
  document.getElementById('pct-b').textContent = pctB + '%';
  document.getElementById('comp-a-num').textContent = pctA + '%';
  document.getElementById('comp-b-num').textContent = pctB + '%';
}

function setFlow(f) {
  document.getElementById('btn-a').classList.toggle('active', f==='a');
  document.getElementById('btn-b').classList.toggle('active', f==='b');
  document.getElementById('btn-a').setAttribute('aria-selected', f==='a');
  document.getElementById('btn-b').setAttribute('aria-selected', f==='b');
}

let recording = true;
function toggleRecord() {
  recording = !recording;
  const btn = document.getElementById('rec-btn');
  btn.classList.toggle('active', recording);
  btn.setAttribute('aria-pressed', recording);
  document.getElementById('rec-label').textContent = recording ? 'Recording' : 'Paused';
}

function exportResults() {
  const data = {
    test: 'Onboarding Flow A/B Test',
    date: new Date().toISOString(),
    flows: {
      A: { steps_completed: state.a + 1, completion_rate: Math.round((state.a/(STEPS-1))*100) + '%' },
      B: { steps_completed: state.b + 1, completion_rate: Math.round((state.b/(STEPS-1))*100) + '%' }
    },
    recommendation: state.b >= state.a ? 'Flow B outperforms Flow A' : 'Flow A outperforms Flow B'
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ab-test-results.json';
  a.click();
}

// Add spin keyframe
const s = document.createElement('style');
s.textContent = '@keyframes spin{to{transform:rotate(360deg)}}';
document.head.appendChild(s);
</script>
</body>
</html>
