<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>GA4 Audit Dashboard — Idris Bakare</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#070d0b;--panel:#0b1410;--surface:#111d18;--surface2:#162420;--line:rgba(255,255,255,.07);
  --fg:#e8f5f0;--muted:#6a9080;--em:#10b981;--em2:#34d399;--em-dim:rgba(16,185,129,.12);
  --red:#f87171;--amber:#fbbf24;--blue:#60a5fa;--mono:'Courier New',monospace;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.shell{display:grid;grid-template-rows:48px 1fr 32px;height:100vh}
/* TOP BAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar-brand{display:flex;align-items:center;gap:10px}
.back{color:var(--muted);text-decoration:none;font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.15em;transition:color .15s}.back:hover{color:var(--em)}
.topbar-sep{color:var(--line);margin:0 10px;font-size:14px}
.topbar-title{font-size:12px;font-weight:600;letter-spacing:.04em}
.topbar-right{display:flex;gap:6px;align-items:center}
.badge{font-size:9px;font-family:var(--mono);text-transform:uppercase;border:1px solid var(--line);color:var(--muted);padding:2px 8px;border-radius:3px}
.badge.em{border-color:rgba(16,185,129,.3);color:var(--em);background:rgba(16,185,129,.06)}
/* BODY */
.body{display:grid;grid-template-columns:240px 1fr;overflow:hidden}
/* SIDEBAR */
.sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.sb-header{padding:14px 16px;border-bottom:1px solid var(--line);flex-shrink:0}
.sb-label{font-size:9px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.2em;color:var(--muted)}
.client-list{flex:1;overflow-y:auto}
.client-list::-webkit-scrollbar{width:3px}
.client-list::-webkit-scrollbar-thumb{background:var(--surface2)}
.client-item{padding:12px 16px;cursor:pointer;border-left:2px solid transparent;border-bottom:1px solid rgba(255,255,255,.03);transition:all .12s}
.client-item:hover{background:rgba(255,255,255,.02)}
.client-item.active{border-left-color:var(--em);background:var(--em-dim)}
.ci-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.ci-name{font-size:12px;font-weight:700;color:var(--fg)}
.ci-score{font-size:13px;font-weight:900;font-family:var(--mono)}
.ci-sub{font-size:10px;color:var(--muted);font-family:var(--mono)}
.ci-bar{height:2px;background:var(--surface2);border-radius:1px;margin-top:8px;overflow:hidden}
.ci-fill{height:100%;border-radius:1px;transition:width .5s cubic-bezier(.16,1,.3,1)}
/* MAIN */
.main{display:flex;flex-direction:column;overflow:hidden}
.tab-bar{display:flex;border-bottom:1px solid var(--line);background:var(--panel);flex-shrink:0}
.tab{padding:12px 18px;font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab.active{color:var(--em);border-bottom-color:var(--em)}
.tab:hover:not(.active){color:var(--fg)}
.panels{flex:1;overflow:hidden;position:relative}
.panel{position:absolute;inset:0;overflow-y:auto;padding:20px;display:none}
.panel.active{display:block}
.panel::-webkit-scrollbar{width:4px}
.panel::-webkit-scrollbar-thumb{background:var(--surface2)}
/* OVERVIEW PANEL */
.overview-grid{display:grid;grid-template-columns:180px 1fr;gap:20px;margin-bottom:20px;align-items:start}
/* SVG gauge */
.gauge-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;gap:6px}
.gauge-label{font-size:9px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.15em;color:var(--muted)}
.gauge-score{font-size:2rem;font-weight:900;font-family:var(--mono)}
.gauge-status{font-size:10px;font-family:var(--mono);text-transform:uppercase;padding:2px 10px;border-radius:10px}
.gs-good{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);color:var(--em)}
.gs-warn{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.25);color:var(--amber)}
.gs-bad{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.25);color:var(--red)}
.client-meta-box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.cmb-title{font-size:14px;font-weight:700;margin-bottom:8px}
.cmb-row{font-size:11px;color:var(--muted);line-height:1.8;font-family:var(--mono)}
.cmb-row span{color:var(--fg)}
.metrics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.metric-val{font-size:1.5rem;font-weight:900;margin-bottom:3px;font-family:var(--mono)}
.metric-label{font-size:9px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.metric-delta{font-size:10px;margin-top:4px}
.delta-up{color:var(--em)}.delta-dn{color:var(--red)}.delta-neu{color:var(--amber)}
/* AUDIT PANEL */
.audit-list{display:flex;flex-direction:column;gap:8px}
.audit-row{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;grid-template-columns:26px 1fr 52px;gap:10px;align-items:start;opacity:0;transform:translateY(5px);transition:opacity .3s,transform .3s}
.audit-row.show{opacity:1;transform:none}
.ai{font-size:14px;font-weight:700;width:26px;text-align:center;padding-top:1px}
.ai-pass{color:var(--em)}.ai-warn{color:var(--amber)}.ai-fail{color:var(--red)}
.ar-title{font-size:12px;font-weight:700;margin-bottom:3px}
.ar-desc{font-size:11px;color:var(--muted);line-height:1.5}
.ar-tag{font-size:9px;font-family:var(--mono);text-transform:uppercase;padding:2px 8px;border-radius:10px;text-align:center;white-space:nowrap;align-self:start}
.tag-pass{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);color:var(--em)}
.tag-warn{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.2);color:var(--amber)}
.tag-fail{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.2);color:var(--red)}
/* EVENTS PANEL */
.events-wrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ev-head{display:grid;grid-template-columns:1fr 90px 90px 110px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);font-size:9px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.15em;color:var(--muted);gap:8px}
.ev-row{display:grid;grid-template-columns:1fr 90px 90px 110px;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.03);gap:8px;transition:background .12s}
.ev-row:hover{background:rgba(255,255,255,.02)}
.ev-row:last-child{border-bottom:none}
.ev-name{font-size:11px;font-family:var(--mono);color:var(--blue)}
.ev-yes{color:var(--em);font-size:11px;font-family:var(--mono)}
.ev-no{color:var(--red);font-size:11px;font-family:var(--mono)}
.ev-time{font-size:10px;color:var(--muted);font-family:var(--mono)}
/* INSIGHTS PANEL */
.insights-grid{display:grid;gap:12px}
.insight{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;grid-template-columns:36px 1fr;gap:14px;align-items:start}
.insight-icon{font-size:18px}
.insight-title{font-size:12px;font-weight:700;margin-bottom:5px}
.insight-body{font-size:11px;color:var(--muted);line-height:1.6}
.insight-action{margin-top:10px;display:inline-block;font-size:9px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--em);padding:3px 10px;border:1px solid rgba(16,185,129,.3);border-radius:10px}
.ins-crit .insight{border-color:rgba(248,113,113,.2)}
.ins-warn .insight{border-color:rgba(251,191,36,.2)}
.ins-good .insight{border-color:rgba(16,185,129,.2)}
/* BOTTOM BAR */
.bottombar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--panel);border-top:1px solid var(--line);font-size:10px;font-family:var(--mono);color:var(--muted)}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--em);display:inline-block;margin-right:6px;animation:pulseG 2s ease-in-out infinite}
@keyframes pulseG{0%,100%{opacity:1}50%{opacity:.4}}
@media(max-width:640px){
  .body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .sidebar{max-height:160px;overflow:auto}
  .sidebar .client-list{display:flex;flex-direction:row;gap:0}
  .client-item{min-width:160px}
  .overview-grid{grid-template-columns:1fr}
  .metrics-grid{grid-template-columns:1fr 1fr}
  .ev-head,.ev-row{grid-template-columns:1fr 70px 70px}
  .ev-time{display:none}
}
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="topbar-brand">
      <a class="back" href="/">← Portfolio</a>
      <span class="topbar-sep">|</span>
      <span class="topbar-title">GA4 Audit Dashboard</span>
    </div>
    <div class="topbar-right">
      <span class="badge">GA4 API</span>
      <span class="badge">GTM</span>
      <span class="badge">Claude API</span>
      <span class="badge em">Analytics Agent</span>
    </div>
  </div>

  <div class="body">
    <!-- SIDEBAR: Client Selector -->
    <div class="sidebar">
      <div class="sb-header"><div class="sb-label">Client Accounts</div></div>
      <div class="client-list" id="clientList"></div>
    </div>

    <!-- MAIN: Tabs + Panels -->
    <div class="main">
      <div class="tab-bar">
        <div class="tab active" onclick="switchTab('overview',this)">Overview</div>
        <div class="tab" onclick="switchTab('audit',this)">Audit Checklist</div>
        <div class="tab" onclick="switchTab('events',this)">Events</div>
        <div class="tab" onclick="switchTab('insights',this)">Insights</div>
      </div>
      <div class="panels">
        <div class="panel active" id="panel-overview"></div>
        <div class="panel" id="panel-audit"></div>
        <div class="panel" id="panel-events"></div>
        <div class="panel" id="panel-insights"></div>
      </div>
    </div>
  </div>

  <div class="bottombar">
    <span><span class="status-dot"></span><span id="statusText">Severus Analytics Agent · 3 clients audited</span></span>
    <span>GA4 Admin API · GTM API · Claude API · TypeScript</span>
  </div>
</div>

<script>
const CLIENTS = [
  {
    name:'OzBarbers London', prop:'G-OZB44819', score:78, scoreColor:'#fbbf24',
    agent:'Severus-Analytics', ran:'Today 07:14 UTC', issues:'3 issues need attention',
    issueColor:'#fbbf24',
    sessions:'4,812', revenue:'£3,240', events:'2 / 6',
    audits:[
      {s:'pass',t:'GA4 Property Connected',d:'Property G-OZB44819 active. Data stream receiving hits continuously.'},
      {s:'pass',t:'GTM Container Installed',d:'GTM-XXXX9 detected on all pages. Container published and verified.'},
      {s:'warn',t:'DebugView Active',d:'DebugView showing test hits. Recommend disabling debug mode before next ad flight.'},
      {s:'fail',t:'Purchase Event Missing',d:'purchase event not configured in GTM. Required for ROAS tracking in Google Ads.'},
      {s:'fail',t:'add_to_cart Not Firing',d:'add_to_cart event absent from GTM container. PDP trigger missing.'},
      {s:'pass',t:'Session / Pageview Baseline',d:'page_view and session_start firing correctly across all pages.'},
      {s:'fail',t:'Conversions Not Imported to Ads',d:'No GA4 conversion actions imported to linked Google Ads account.'},
    ],
    events:[
      {n:'page_view',conf:true,fire:true,last:'2 min ago'},
      {n:'session_start',conf:true,fire:true,last:'2 min ago'},
      {n:'purchase',conf:false,fire:false,last:'Never'},
      {n:'add_to_cart',conf:false,fire:false,last:'Never'},
      {n:'begin_checkout',conf:true,fire:false,last:'Never'},
      {n:'view_item',conf:true,fire:true,last:'5 min ago'},
    ],
    insights:[
      {sev:'crit',icon:'🔴',title:'Missing Purchase Conversion',body:'No purchase event means Google Ads is bidding blind. Smart Bidding requires 30 conversions/month minimum. Current: 0. Fix: add GTM trigger on order confirmation URL.',action:'Fix in GTM'},
      {sev:'warn',icon:'🟡',title:'DebugView Not Disabled',body:'Test traffic is contaminating production data. Bounce rate and session duration data may be skewed. Disable debug mode in GTM workspace before going live.',action:'Disable Debug Mode'},
      {sev:'warn',icon:'🟡',title:'Ads Account Not Linked',body:'Without linked conversions, Google Ads cannot optimise toward actual purchases. PMax will optimise toward proxy signals only.',action:'Import Conversions'},
    ]
  },
  {
    name:'Bloom & Wild', prop:'G-BWL99201', score:91, scoreColor:'#10b981',
    agent:'Severus-Analytics', ran:'Yesterday 09:30 UTC', issues:'1 minor issue',
    issueColor:'#10b981',
    sessions:'12,340', revenue:'£18,900', events:'5 / 5',
    audits:[
      {s:'pass',t:'GA4 Property Connected',d:'Property G-BWL99201 active. 12k daily sessions tracked accurately.'},
      {s:'pass',t:'GTM Container Installed',d:'GTM-BW001 on all pages including checkout flow and thank-you page.'},
      {s:'pass',t:'Purchase Event Firing',d:'purchase event confirmed firing on order confirmation. Revenue data accurate.'},
      {s:'pass',t:'add_to_cart Configured',d:'add_to_cart firing correctly from PDP and quick-add button.'},
      {s:'warn',t:'Cross-Domain Tracking Gap',d:'Blog subdomain blog.bloomandwild.com not linked to main GA4 property. Minor attribution gap for content-assisted sessions.'},
      {s:'pass',t:'Conversions in Google Ads',d:'3 conversion actions imported and active — purchase, subscription, newsletter.'},
      {s:'pass',t:'Enhanced Ecommerce',d:'Full funnel tracked: view_item → add_to_cart → begin_checkout → purchase.'},
    ],
    events:[
      {n:'purchase',conf:true,fire:true,last:'3 min ago'},
      {n:'add_to_cart',conf:true,fire:true,last:'1 min ago'},
      {n:'begin_checkout',conf:true,fire:true,last:'4 min ago'},
      {n:'view_item',conf:true,fire:true,last:'30s ago'},
      {n:'refund',conf:true,fire:true,last:'1h ago'},
    ],
    insights:[
      {sev:'warn',icon:'🟡',title:'Blog Subdomain Not Linked',body:'Content from blog.bloomandwild.com drives ~18% of organic sessions but those sessions are attributed to direct/organic without cross-domain linking. Fix: add blog subdomain to GA4 Measurement settings.',action:'Add Cross-Domain'},
      {sev:'good',icon:'🟢',title:'Full Funnel Tracking Active',body:'All 5 ecommerce funnel events are configured and firing. Smart Bidding has 30+ conversions/month — eligible for Target ROAS bidding.',action:'Expand Campaign'},
      {sev:'good',icon:'🟢',title:'Revenue Attribution Accurate',body:'GA4 revenue matches Shopify within 2%. Attribution window is set to 30-day click, 1-day view. Recommend testing data-driven attribution model.',action:'Test DDA Model'},
    ]
  },
  {
    name:'TechStack SaaS', prop:'G-TS55021', score:54, scoreColor:'#f87171',
    agent:'Severus-Analytics', ran:'3 days ago', issues:'5 critical issues',
    issueColor:'#f87171',
    sessions:'—', revenue:'—', events:'0 / 4',
    audits:[
      {s:'fail',t:'GA4 Data Stream Inactive',d:'No hits received in last 48h. Tracking snippet likely missing from app.'},
      {s:'fail',t:'GTM Not Detected',d:'GTM container not found on any page. Manual install required from developer.'},
      {s:'fail',t:'No Conversion Events',d:'Zero conversion events configured. Cannot track trial signups or purchases.'},
      {s:'fail',t:'Google Ads Not Linked',d:'GA4 property not linked to Google Ads account. Bidding is unoptimised.'},
      {s:'warn',t:'Bounce Rate Anomaly',d:'Bounce rate 94% — possible SPA tracking issue or missing navigation events.'},
      {s:'fail',t:'Cross-Domain Not Configured',d:'App subdomain app.techstack.io not in measurement. User sessions break at login.'},
    ],
    events:[
      {n:'page_view',conf:true,fire:false,last:'3d ago'},
      {n:'sign_up',conf:false,fire:false,last:'Never'},
      {n:'trial_start',conf:false,fire:false,last:'Never'},
      {n:'purchase',conf:false,fire:false,last:'Never'},
    ],
    insights:[
      {sev:'crit',icon:'🔴',title:'Tracking Completely Broken',body:'No GA4 data in 48h. Campaigns are bidding on zero conversion data. Every hour without tracking is attributed revenue lost. Priority 1: install GTM snippet on all pages including the app subdomain.',action:'Install GTM Now'},
      {sev:'crit',icon:'🔴',title:'Google Ads Bidding Blind',body:'£4k/month Google Ads spend with zero conversion tracking. Smart Bidding is using proxy signals only. ROAS is unmeasured. Fix tracking before running any further spend.',action:'Pause Ads Until Fixed'},
      {sev:'warn',icon:'🟡',title:'SPA Navigation Events Missing',body:'94% bounce rate suggests GA4 is only firing on initial load — not on SPA route changes. Add a history-change trigger in GTM to track in-app navigation.',action:'Add SPA Trigger'},
    ]
  },
];

let active = 0;

function scoreColor(s) {
  if (s >= 85) return 'var(--em)';
  if (s >= 65) return 'var(--amber)';
  return 'var(--red)';
}

function buildSidebar() {
  const list = document.getElementById('clientList');
  list.innerHTML = CLIENTS.map((c, i) => `
    <div class="client-item${i===0?' active':''}" onclick="selectClient(${i})" id="ci${i}">
      <div class="ci-top">
        <span class="ci-name">${c.name}</span>
        <span class="ci-score" style="color:${scoreColor(c.score)}">${c.score}</span>
      </div>
      <div class="ci-sub">${c.prop}</div>
      <div class="ci-bar"><div class="ci-fill" style="width:${c.score}%;background:${scoreColor(c.score)}"></div></div>
    </div>
  `).join('');
}

function selectClient(i) {
  document.querySelectorAll('.client-item').forEach(el => el.classList.remove('active'));
  document.getElementById('ci'+i).classList.add('active');
  active = i;
  renderAll();
  document.getElementById('statusText').textContent = `${CLIENTS[i].name} · Last audit: ${CLIENTS[i].ran} · Score: ${CLIENTS[i].score}/100`;
}

function buildGaugeSVG(score, color) {
  const r = 44, cx = 56, cy = 56, sw = 7;
  const circ = 2 * Math.PI * r;
  const pct = score / 100;
  const dash = pct * circ * 0.75;
  const offset = circ * 0.125;
  return `<svg width="112" height="90" viewBox="0 0 112 90" style="overflow:visible">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="${sw}"
      stroke-dasharray="${circ*0.75} ${circ*0.25}" stroke-dashoffset="${-offset}" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-dasharray="${dash} ${circ}" stroke-dashoffset="${-offset}" stroke-linecap="round"
      style="filter:drop-shadow(0 0 6px ${color}55);transition:stroke-dasharray 1s cubic-bezier(.16,1,.3,1)"/>
    <text x="${cx}" y="${cy+6}" text-anchor="middle" fill="${color}" font-size="22" font-weight="900" font-family="Courier New,monospace">${score}</text>
    <text x="${cx}" y="${cy+20}" text-anchor="middle" fill="rgba(255,255,255,.3)" font-size="9" font-family="Courier New,monospace" letter-spacing="2">/ 100</text>
  </svg>`;
}

function renderOverview() {
  const c = CLIENTS[active];
  const col = scoreColor(c.score);
  const statusClass = c.score >= 85 ? 'gs-good' : c.score >= 65 ? 'gs-warn' : 'gs-bad';
  const statusText = c.score >= 85 ? 'Healthy' : c.score >= 65 ? 'Issues' : 'Critical';
  document.getElementById('panel-overview').innerHTML = `
    <div class="overview-grid">
      <div class="gauge-wrap">
        <div class="gauge-label">Audit Score</div>
        ${buildGaugeSVG(c.score, col)}
        <span class="gauge-status ${statusClass}">${statusText}</span>
      </div>
      <div class="client-meta-box">
        <div class="cmb-title">${c.name}</div>
        <div class="cmb-row">Property: <span>${c.prop}</span></div>
        <div class="cmb-row">Audit run: <span>${c.ran}</span></div>
        <div class="cmb-row">Agent: <span>${c.agent}</span></div>
        <div class="cmb-row" style="margin-top:6px">Status: <span style="color:${c.issueColor}">${c.issues}</span></div>
      </div>
    </div>
    <div class="metrics-grid">
      <div class="metric"><div class="metric-val" style="color:var(--blue)">${c.sessions}</div><div class="metric-label">7d Sessions</div></div>
      <div class="metric"><div class="metric-val" style="color:var(--em)">${c.revenue}</div><div class="metric-label">Tracked Revenue</div></div>
      <div class="metric"><div class="metric-val" style="color:${col}">${c.events}</div><div class="metric-label">Events Active</div></div>
    </div>
  `;
}

function renderAudit() {
  const c = CLIENTS[active];
  const panel = document.getElementById('panel-audit');
  panel.innerHTML = `<div class="audit-list">${c.audits.map(a => `
    <div class="audit-row">
      <span class="ai ai-${a.s}">${a.s==='pass'?'✓':a.s==='fail'?'✗':'!'}</span>
      <div><div class="ar-title">${a.t}</div><div class="ar-desc">${a.d}</div></div>
      <span class="ar-tag tag-${a.s}">${a.s}</span>
    </div>`).join('')}</div>`;
  setTimeout(() => panel.querySelectorAll('.audit-row').forEach((r,i) => setTimeout(() => r.classList.add('show'), i*60)), 30);
}

function renderEvents() {
  const c = CLIENTS[active];
  document.getElementById('panel-events').innerHTML = `
    <div class="events-wrap">
      <div class="ev-head"><span>Event Name</span><span>Configured</span><span>Firing</span><span>Last Seen</span></div>
      ${c.events.map(e => `
        <div class="ev-row">
          <span class="ev-name">${e.n}</span>
          <span class="${e.conf?'ev-yes':'ev-no'}">${e.conf?'✓ Yes':'✗ No'}</span>
          <span class="${e.fire?'ev-yes':'ev-no'}">${e.fire?'✓ Firing':'✗ Silent'}</span>
          <span class="ev-time">${e.last}</span>
        </div>`).join('')}
    </div>`;
}

function renderInsights() {
  const c = CLIENTS[active];
  document.getElementById('panel-insights').innerHTML = `
    <div class="insights-grid">${c.insights.map(ins => `
      <div class="ins-${ins.sev}">
        <div class="insight">
          <span class="insight-icon">${ins.icon}</span>
          <div>
            <div class="insight-title">${ins.title}</div>
            <div class="insight-body">${ins.body}</div>
            <span class="insight-action">${ins.action} →</span>
          </div>
        </div>
      </div>`).join('')}
    </div>`;
}

function renderAll() {
  renderOverview();
  renderAudit();
  renderEvents();
  renderInsights();
}

function switchTab(id, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-'+id).classList.add('active');
}

buildSidebar();
renderAll();
</script>
</body>
</html>
